# =============================================================================
# NEWS  (shown on the News page and as a preview on the landing page)
# =============================================================================

# LAYOUT VARIANT — choose ONE:
#
#   featured-lead - First article shown large at the top (full-width banner),
#                   remaining articles shown in a grid below. Best default.
#
#   grid          - All articles shown in equal-sized cards in a grid.
#                   Good when no single article is more important than others.
#
variant: grid

# ---------------------------------------------------------------------------
# NEWS ARTICLES
# ---------------------------------------------------------------------------
# For each article:
#   id      — A unique slug used in the URL. Use only lowercase letters,
#             numbers, and hyphens. No spaces. (e.g., "sba-wins-at-olympíad")
#   title   — Short title shown in lists and cards
#   headline — Longer display headline shown inside the full article
#   author  — Who wrote the article
#   date    — Format: YYYY-MM-DD (e.g., 2024-03-10)
#   excerpt — One or two sentence summary shown on cards
#   story   — The full article text. Use \n\n to separate paragraphs.
#
# HOW TO ADD A NEWS COVER PHOTO:
#   1. Save the photo inside "public/images/news/" folder.
#      Ideal size: 1200×630 px (16:9 ratio). Format: WebP.
#      Example: public/images/news/accounting-olympiad.webp
#   2. Set the image value to just the filename with subfolder:
#        image: "news/accounting-olympiad.webp"
#   3. Leave as "" to show a colored placeholder.
#
# HOW TO ADD PHOTOS INSIDE AN ARTICLE (the photos[] list):
#   Same steps as above — save in the same folder, then set the image path.
#   Add a caption to describe each photo.
news:
  - id: "sihm-bangusine-2025-grand-champion"
    title: "SIHM Reclaims Bangusine 2025 Grand Champion Title"
    headline: "UDD-SIHM Crowned Champions at Bangusine 2025 Cooking Competition"
    author: "SIHM Communications Office"
    date: "2025-04-28"
    excerpt: "The School of International Hospitality Management reclaimed its title as Bangusine 2025 Grand Champion, showcasing excellence in culinary innovation, presentation, and teamwork at the prestigious city-wide competition."
    story: "The School of International Hospitality Management (SIHM) proudly reclaimed its title as the Bangusine 2025 Grand Champion on April 28, 2025, at the Dagupan City Plaza. The competition, themed 'A Taste of Europe,' challenged participating schools to create innovative European dishes featuring Dagupan's famous bangus (milkfish).\n\nOur SIHM culinary team demonstrated exceptional skill in culinary innovation, presentation, and teamwork, impressing judges with their creative interpretation of European cuisine using local ingredients. This victory solidifies UDD-SIHM's reputation as a leader in hospitality education in the region.\n\nProgram Head John Marc Lomibao expressed pride in the students' achievement: 'This championship reflects our commitment to excellence in hospitality education. Our students' creativity and technical skills showcase the quality of training they receive at SIHM.'"
    image: ""
    photos:
      - image: ""
        caption: "SIHM culinary team presents their award-winning European-inspired bangus dish"
      - image: ""
        caption: "Team receives the Grand Champion trophy at Bangusine 2025"

  - id: "sihm-mindanaoan-bangus-innovation"
    title: "SIHM Students Win 3rd Place with Mindanaoan Bangus Creation"
    headline: "UDD-SIHM Clinches Third Place with Innovative Mindanao-Inspired Bangus Dish"
    author: "SIHM Communications Office"
    date: "2024-11-15"
    excerpt: "SIHM students earned third place in a regional culinary competition by putting a creative Mindanaoan twist on Dagupan's signature bangus, featuring coconut strips, green mango, and pineapple."
    story: "The School of International Hospitality Management earned third place in a prestigious regional culinary competition with their innovative dish that beautifully merges Mindanaoan flavors with Dagupan's famous bangus.\n\nThe creative entry featured a unique Ensalada with coconut strips, green mango, and pineapple, designed to create an explosive burst of flavors that honored both Mindanaoan culinary traditions and Pangasinan's heritage. The dish impressed judges with its cultural sensitivity, technical execution, and innovative approach to fusion cuisine.\n\nProgram Head John Marc Lomibao praised the students' creativity: 'This achievement demonstrates our students' ability to think beyond conventional boundaries while respecting cultural culinary traditions. It's exactly the kind of innovative thinking we cultivate at SIHM.'"
    image: ""
    photos:
      - image: ""
        caption: "The award-winning Mindanaoan-inspired bangus creation"

  - id: "sihm-faculty-chmp-ctmp-certification"
    title: "SIHM Faculty Achieves CHMP and CTMP Professional Certifications"
    headline: "SIHM Faculty Members Earn Prestigious International Hospitality Certifications"
    author: "SIHM Communications Office"
    date: "2024-09-20"
    excerpt: "SIHM faculty members successfully passed the Certified Hospitality Management Professional (CHMP) and Certified Tourism Management Professional (CTMP) examinations, strengthening the school's commitment to industry excellence."
    story: "The School of International Hospitality Management celebrates a major milestone as multiple faculty members successfully achieved Certified Hospitality Management Professional (CHMP) and Certified Tourism Management Professional (CTMP) certifications.\n\nThese internationally recognized credentials demonstrate SIHM's commitment to maintaining the highest standards of hospitality education. The rigorous certification process involves comprehensive modules covering industry best practices, leadership, operations management, and contemporary hospitality trends.\n\n'These certifications ensure that our students learn from industry-validated professionals who possess current, globally-recognized expertise,' said the SIHM administration. 'This achievement reinforces our position as a leader in hospitality education in Region I.'\n\nThe CHMP and CTMP programs are designed to equip professionals with essential skills and knowledge to excel in hospitality and tourism management, covering areas such as strategic planning, service excellence, and sustainable tourism practices."
    image: ""
    photos:
      - image: ""
        caption: "Newly certified CHMP and CTMP faculty members"

  - id: "sihm-sanitation-awareness-drive"
    title: "SIHM Leads Sanitation Awareness Drive at Macayug Elementary"
    headline: "SIHM Students Champion Community Health Through Sanitation Education"
    author: "SIHM Communications Office"
    date: "2024-11-06"
    excerpt: "SIHM students led a successful sanitation awareness drive at Macayug Elementary School, demonstrating the school's commitment to community engagement and sustainable development goals."
    story: "The School of International Hospitality Management demonstrated its commitment to community service and Sustainable Development Goals by leading a comprehensive sanitation awareness drive at Macayug Elementary School.\n\nSIHM students conducted interactive workshops on proper hygiene practices, food safety, and environmental sanitation, engaging elementary students through age-appropriate activities and demonstrations. The initiative aligns with SDG 1 (Good Health and Well-being) and reflects SIHM's mission to develop socially responsible hospitality professionals.\n\n'This outreach exemplifies how hospitality education extends beyond the classroom,' said a SIHM faculty coordinator. 'Our students learn that service excellence includes contributing to community health and well-being.'\n\nThe program received positive feedback from school administrators and highlighted SIHM's role as a community partner in promoting public health and environmental awareness."
    image: ""
    photos:
      - image: ""
        caption: "SIHM students conduct sanitation workshop at Macayug Elementary"