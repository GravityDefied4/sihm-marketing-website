# =============================================================================
# ACADEMICS PAGE
# Includes: Program information, institutional outcomes, PATHFIT, advocacy.
# =============================================================================

# PROGRAMS LAYOUT VARIANT — choose ONE:
#
#   accordion - Programs listed as expandable items. Great for many programs.
#   cards     - Each program shown as a full card. Better for 2–4 programs.
#
programsVariant: cards

# ---------------------------------------------------------------------------
# DEGREE PROGRAMS
# ---------------------------------------------------------------------------
# type must be one of: undergraduate, graduate, postgraduate
programs:
  - name: "Bachelor of Science in Hospitality Management"
    abbreviation: "BSHM"
    description: "A dynamic program offering immersive learning in hotel and restaurant operations, culinary arts, and event management. Students train in state-of-the-art mock facilities, preparing them for leadership roles in the global hospitality industry."
    duration: "4 years"
    type: "undergraduate"
    objectives:
      - "Produce hospitality graduates equipped with global standards of service excellence."
      - "Develop strong operational and managerial skills in lodging, food, and beverage services."
      - "Foster ethical, culturally sensitive, and innovative hospitality practitioners."
    outcomes:
      - "Apply international hospitality standards in front office, housekeeping, and F&B operations."
      - "Design and execute professional events and conferences with efficiency."
      - "Demonstrate exceptional guest relations and conflict-resolution skills."
    careerOpportunities:
      - "Hotel / Resort General Manager"
      - "Food and Beverage Director"
      - "Event Planner / Coordinator"
      - "Cruise Line Operations Manager"
      - "Guest Relations Manager"

  - name: "Bachelor of Science in Tourism Management"
    abbreviation: "BSTM"
    description: "A forward-looking program that develops well-rounded tourism professionals equipped to manage travel operations, destination marketing, and sustainable tourism development on both local and global scales."
    duration: "4 years"
    type: "undergraduate"
    objectives:
      - "Prepare graduates for management positions in travel agencies, tour operations, and destination marketing organizations."
      - "Develop competencies in sustainable tourism planning and cultural heritage preservation."
      - "Cultivate an entrepreneurial mindset in tourism enterprise management."
    outcomes:
      - "Apply tourism principles and management theories in real-world travel scenarios."
      - "Formulate and implement sustainable tourism development strategies."
      - "Analyze market trends and traveler behavior for effective tourism marketing."
    careerOpportunities:
      - "Tour Operations Manager"
      - "Travel Agency Manager"
      - "Destination Marketing Specialist"
      - "Eco-Tourism Development Officer"
      - "Entrepreneur / Tourism Business Owner"

# ---------------------------------------------------------------------------
# INSTITUTIONAL LEARNING OUTCOMES
# ---------------------------------------------------------------------------
academics:
  institutionalOutcomes:
    - "Demonstrate professional and ethical competence in hospitality and tourism."
    - "Apply critical thinking and problem-solving skills in service delivery."
    - "Communicate effectively in diverse, multicultural, and international environments."
    - "Work collaboratively in multi-disciplinary teams."
    - "Commit to lifelong learning and sustainable industry practices."
  outcomesCommonToAllHEIs:
    - "Articulate and discuss the latest developments in the specific field of practice."
    - "Effectively communicate orally and in writing using both English and Filipino."
    - "Work effectively and independently in multi-disciplinary and multi-cultural teams."
    - "Act in recognition of professional, social, and ethical responsibility."
    - "Preserve and promote Filipino historical and cultural heritage."
  pathfit: "All students complete Physical Activity Towards Health and Fitness (PATHFIT) subjects. These promote active, healthy lifestyles, which are essential for the physically demanding and high-energy nature of hospitality and tourism professions."
  advocacy: "SIHM actively advocates for sustainable tourism, cultural heritage preservation, and community-based hospitality development. Students and faculty regularly lead coastal clean-ups, eco-tourism initiatives, and service excellence workshops for local tourism stakeholders in Dagupan and beyond."
