# ---------------------------------------------------------------------------
# SCHOOL HISTORY & FUTURE DIRECTION
# ---------------------------------------------------------------------------
about:
  history: "The School of International Hospitality Management was established with a vision of producing competent hospitality and tourism professionals who would contribute to the economic development of the region through world-class service. From its humble beginnings, the school has grown into one of the most respected academic institutions in Pangasinan, consistently producing graduates who excel in hotel management, culinary arts, and tourism development."
  future: "SIHM is committed to continuously evolving its curriculum to meet the demands of the rapidly changing global tourism landscape. We envision a future where our graduates lead in sustainable tourism, drive innovative hospitality practices, and contribute to national development through ethical and culturally sensitive leadership."

  # Vision, mission, and core values
  vision: "A premier school of hospitality and tourism in the region, producing globally competitive, culturally sensitive, and environmentally responsible professionals."
  mission: "To provide quality, affordable hospitality and tourism education through immersive learning, industry partnerships, and community engagement, fostering excellence and innovation in service."

  # Core values — each item needs a title, description, and icon name.
  # Available icons: Star, Shield, Lightbulb, Heart, Award, BookOpen, Users, Target
  coreValues:
    - title: "Service Excellence"
      description: "We pursue the highest standards in guest service, operational quality, and professional practice."
      icon: "Star"
    - title: "Integrity"
      description: "We uphold honesty, transparency, and ethical conduct in all our hospitality endeavors."
      icon: "Shield"
    - title: "Innovation"
      description: "We embrace new ideas, technologies, and sustainable approaches to advance hospitality education."
      icon: "Lightbulb"
    - title: "Cultural Respect"
      description: "We are committed to honoring diverse cultures and promoting inclusive, global-minded service."
      icon: "Heart"

  # Timeline — add or remove milestones as needed. Keep year as a 4-digit string.
  timeline:
    - year: "2005"
      event: "School of International Hospitality Management founded with BSHM and BSTM programs."
    - year: "2015"
      event: "Established state-of-the-art mock hotel, training kitchen, and tourism lab facilities."
    - year: "2018"
      event: "Launched international internship exchange programs with partner institutions."
    - year: "2023"
      event: "Recognized for excellence in sustainable tourism education and community outreach."
    - year: "2024"
      event: "SIHM Faculty achieve prestigious CHMP and CTMP professional certifications."
    - year: "2025"
      event: "Reclaims Grand Champion title at the Bangusine Festival Cheerdance Competition."
